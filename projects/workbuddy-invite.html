<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分享链接 - WorkBuddy AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            padding: 48px 40px;
            max-width: 420px;
            width: 100%;
            text-align: center;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .logo span {
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 14px;
            color: #999;
            margin-bottom: 32px;
        }

        .qrcode-wrapper {
            display: inline-block;
            padding: 16px;
            border: 2px solid #f0f0f0;
            border-radius: 16px;
            margin-bottom: 28px;
            transition: transform 0.2s ease;
        }

        .qrcode-wrapper:hover {
            transform: scale(1.02);
        }

        #qrcode {
            display: inline-block;
        }

        #qrcode canvas,
        #qrcode img {
            display: block;
            border-radius: 8px;
        }

        .link-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f7f8fa;
            border: 1px solid #e8e8e8;
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 20px;
        }

        .link-text {
            flex: 1;
            font-size: 13px;
            color: #333;
            text-align: left;
            word-break: break-all;
            user-select: all;
        }

        .copy-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .copy-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .copy-btn:active {
            transform: translateY(0);
        }

        .copy-btn.copied {
            background: #52c41a;
        }

        .tip {
            font-size: 12px;
            color: #bbb;
            margin-top: 24px;
            line-height: 1.6;
        }

        .actions {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .action-btn {
            flex: 1;
            padding: 12px;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            background: #fff;
            font-size: 14px;
            color: #333;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .action-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .action-btn svg {
            width: 16px;
            height: 16px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">Work<span>Buddy</span> AI</div>
        <div class="subtitle">扫描下方二维码或复制链接，立即加入</div>

        <div class="qrcode-wrapper">
            <div id="qrcode"></div>
        </div>

        <div class="link-box">
            <div class="link-text" id="linkText">https://workbuddy.ai/invite?code=LP3G3VDB</div>
        </div>

        <div class="actions">
            <button class="copy-btn" id="copyBtn" onclick="copyLink()">
                一键复制链接
            </button>
        </div>

        <div class="tip">
            扫码或点击复制即可分享给好友
        </div>
    </div>

    <!-- QRCode.js library -->
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script>
        var shareLink = 'https://workbuddy.ai/invite?code=LP3G3VDB';

        // Generate QR Code
        var qrcode = new QRCode(document.getElementById('qrcode'), {
            text: shareLink,
            width: 200,
            height: 200,
            colorDark: '#1a1a2e',
            colorLight: '#ffffff',
            correctLevel: QRCode.CorrectLevel.H
        });

        // Copy link function
        function copyLink() {
            var btn = document.getElementById('copyBtn');
            var linkText = document.getElementById('linkText');

            // Use Clipboard API
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(shareLink).then(function() {
                    onCopySuccess(btn);
                }).catch(function() {
                    fallbackCopy(linkText, btn);
                });
            } else {
                fallbackCopy(linkText, btn);
            }
        }

        function fallbackCopy(element, btn) {
            var range = document.createRange();
            range.selectNode(element);
            window.getSelection().removeAllRanges();
            window.getSelection().addRange(range);
            try {
                document.execCommand('copy');
                onCopySuccess(btn);
            } catch (err) {
                btn.textContent = '复制失败，请手动选中';
            }
            window.getSelection().removeAllRanges();
        }

        function onCopySuccess(btn) {
            var originalText = btn.textContent;
            btn.textContent = '已复制 ✓';
            btn.classList.add('copied');
            setTimeout(function() {
                btn.textContent = originalText;
                btn.classList.remove('copied');
            }, 2000);
        }
    </script>
</body>
</html>
